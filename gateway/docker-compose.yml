services:
  olla:
    image: ghcr.io/thushan/olla:v0.0.28
    container_name: dgx-olla
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${OLLA_PORT:-40114}:40114"
    environment:
      SG_API_ENDPOINT: ${SG_API_ENDPOINT}
      SG_API_KEY: ${SG_API_KEY}
    volumes:
      - ./config/olla.yaml:/config/olla.yaml:ro
    command: ["--config", "/config/olla.yaml"]

  api:
    build: ./api
    container_name: dgx-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${API_PORT:-50080}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHAT_SERVICE_KEY: ${CHAT_SERVICE_KEY}
      ADMIN_SERVICE_KEY: ${ADMIN_SERVICE_KEY}
      OLLA_URL: http://olla:40114
      API_LISTEN: ":8080"
      SYSTEM_PROMPT_FILE: /config/system-prompt.md
      SG_API_ENDPOINT: ${SG_API_ENDPOINT}
      SG_API_KEY: ${SG_API_KEY}
      INFRA_READ_KEY: ${INFRA_READ_KEY:-}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://192.168.1.119:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-dgx-gateway-pi-power}
      TASMOTA_TOPIC: ${TASMOTA_TOPIC:-pi_power}
      INFRA_CONTROL_KEY: ${INFRA_CONTROL_KEY:-}
      DGX_SPARK_TASMOTA_TOPIC: ${DGX_SPARK_TASMOTA_TOPIC:-dgx_spark_sg_power}
      DGX_SPARK_SSH_ADDR: ${DGX_SPARK_SSH_ADDR:-}
      DGX_SPARK_SSH_USER: ${DGX_SPARK_SSH_USER:-spark-power}
      DGX_SPARK_SSH_KEY_FILE: ${DGX_SPARK_SSH_KEY_FILE:-/run/secrets/spark_power_ssh_key}
      DGX_SPARK_SSH_KNOWN_HOSTS_FILE: ${DGX_SPARK_SSH_KNOWN_HOSTS_FILE:-/run/secrets/spark_known_hosts}
      DGX_SPARK_OFF_MAX_WATTS: ${DGX_SPARK_OFF_MAX_WATTS:-}
    volumes:
      - ./system-prompt.md:/config/system-prompt.md:ro
      - ./secrets:/run/secrets:ro
