# Example cloudflared config for api.dgxspark.dev → Go API front-door.
# Install cloudflared on the gateway VM (GCP / Oracle / any VPS), then:
#
#   cloudflared tunnel create dgx-api
#   cloudflared tunnel route dns dgx-api api.dgxspark.dev
#   sudo cloudflared service install
#
# Keep www.dgxspark.dev on Vercel — do not point www at this tunnel.

tunnel: <TUNNEL_UUID>
credentials-file: /etc/cloudflared/<TUNNEL_UUID>.json

ingress:
  - hostname: api.dgxspark.dev
    service: http://127.0.0.1:8080
  - service: http_status:404
